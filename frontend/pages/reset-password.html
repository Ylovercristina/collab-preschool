<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Set new password — Play & Grow</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css" />
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <a href="../index.html" class="brand"><span class="dot"></span> Play & Grow</a>
    <h1>Choose a new password</h1>
    <div id="msg" class="form-msg"></div>

    <form id="resetForm">
      <div class="field">
        <label for="password">New password</label>
        <input type="password" id="password" required minlength="6" />
      </div>
      <button type="submit" class="btn btn-primary btn-block">Update password</button>
    </form>

    <p class="auth-foot"><a href="login.html">Back to log in</a></p>
  </div>
</div>

<script src="../js/api.js"></script>
<script>
const token = new URLSearchParams(window.location.search).get('token');

document.getElementById('resetForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const msg = document.getElementById('msg');
  msg.className = 'form-msg';
  if (!token) return showMsg(msg, 'Missing or invalid reset link.');

  try {
    const data = await api.post('/auth/reset-password', { token, newPassword: document.getElementById('password').value }, { auth: false });
    showMsg(msg, data.message, 'success');
    setTimeout(() => (window.location.href = 'login.html'), 1400);
  } catch (err) {
    showMsg(msg, err.message);
  }
});
</script>
</body>
</html>
