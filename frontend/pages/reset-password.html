<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Set new password — Play-is-School</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
<link rel="stylesheet" href="../css/style.css" />
</head>
<body>
<div class="auth-page-wrap">
  <div class="auth-container">
    <!-- Left Column: Brand Showcase -->
    <div class="auth-brand-side">
      <div class="auth-brand-badge">
        <img src="../img/logocollab.jpg" alt="Play-is-School Logo Thumbnail" />
        <div class="text-group">
          <span class="school-title">Play-is-School</span>
          <span class="school-sub">Learning Platform</span>
        </div>
      </div>

      <div class="auth-logo-center">
        <div class="auth-logo-card">
          <img src="../img/logocollab.jpg" alt="Play-is-School Logo" />
        </div>
      </div>

      <div class="auth-brand-foot">
        <h3>Learning through Play</h3>
        <p>Early Childhood Learning &amp; Safety Hub</p>
      </div>
    </div>

    <!-- Right Column: Form -->
    <div class="auth-form-side">
      <h2>Choose New Password</h2>
      <p class="sub-text">Enter a strong password for your account.</p>

      <div id="msg" class="form-msg"></div>

      <form id="resetForm">
        <div class="auth-field">
          <label class="auth-label" for="password">NEW PASSWORD</label>
          <div class="input-with-icon">
            <input type="password" id="password" placeholder="At least 6 characters" required minlength="6" autocomplete="new-password" />
            <button type="button" class="toggle-password-btn" id="togglePasswordBtn" aria-label="Toggle password visibility">
              <i class="fa-regular fa-eye" id="passwordEyeIcon"></i>
            </button>
          </div>
        </div>
        <button type="submit" class="btn btn-primary btn-block" style="margin-top: 10px;">
          Update Password &nbsp;&rarr;
        </button>
      </form>

      <div class="auth-divider">or</div>

      <div class="auth-bottom-switch">
        <a href="login.html">Back to Sign In</a>
      </div>
    </div>
  </div>
</div>

<script src="../js/api.js"></script>
<script>
// Eye toggle password visibility
const toggleBtn = document.getElementById('togglePasswordBtn');
const passwordInput = document.getElementById('password');
const eyeIcon = document.getElementById('passwordEyeIcon');

toggleBtn.addEventListener('click', () => {
  const isPassword = passwordInput.getAttribute('type') === 'password';
  passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
  eyeIcon.className = isPassword ? 'fa-regular fa-eye-slash' : 'fa-regular fa-eye';
});

const token = new URLSearchParams(window.location.search).get('token');

document.getElementById('resetForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const msg = document.getElementById('msg');
  msg.className = 'form-msg';
  if (!token) return showMsg(msg, 'Missing or invalid reset link.');

  try {
    const data = await api.post('/auth/reset-password', { token, newPassword: document.getElementById('password').value }, { auth: false });
    showMsg(msg, data.message, 'success');
    setTimeout(() => (window.location.href = 'login.html'), 1400);
  } catch (err) {
    showMsg(msg, err.message);
  }
});
</script>
</body>
</html>
