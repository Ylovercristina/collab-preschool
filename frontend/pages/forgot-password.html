<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Reset password — Play-is-School</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
<link rel="stylesheet" href="../css/style.css" />
</head>
<body>
<div class="auth-page-wrap">
  <div class="auth-container">
    <!-- Left Column: Brand Showcase -->
    <div class="auth-brand-side">
      <div class="auth-brand-badge">
        <img src="../img/logocollab.jpg" alt="Play-is-School Logo Thumbnail" />
        <div class="text-group">
          <span class="school-title">Play-is-School</span>
          <span class="school-sub">Learning Platform</span>
        </div>
      </div>

      <div class="auth-logo-center">
        <div class="auth-logo-card">
          <img src="../img/logocollab.jpg" alt="Play-is-School Logo" />
        </div>
      </div>

      <div class="auth-brand-foot">
        <h3>Learning through Play</h3>
        <p>Early Childhood Learning &amp; Safety Hub</p>
      </div>
    </div>

    <!-- Right Column: Reset Form -->
    <div class="auth-form-side">
      <section id="requestStage">
      <h2>Reset Password</h2>
      <p class="sub-text">Enter the Gmail address linked to your account.</p>

      <div id="msg" class="form-msg" role="status" aria-live="polite"></div>

      <form id="forgotForm">
        <div class="auth-field">
          <label class="auth-label" for="email">EMAIL ADDRESS</label>
          <input type="email" id="email" placeholder="name@gmail.com" required maxlength="254" autocomplete="email" />
        </div>
        <button type="submit" id="sendOtpBtn" class="btn btn-primary btn-block" style="margin-top: 10px;">
          Send Verification Code &nbsp;&rarr;
        </button>
      </form>
      </section>

      <section id="verificationStage" style="display:none;">
        <h2>Verify Your Email</h2>
        <p class="sub-text">Enter the 6-digit code sent to your email address.</p>
        <div id="verifyMsg" class="form-msg" role="status" aria-live="polite"></div>
        <form id="verifyForm">
          <div class="auth-field">
            <label class="auth-label" for="otp">6-DIGIT OTP</label>
            <input class="otp-code-input" type="text" id="otp" placeholder="000000" required inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" />
          </div>
          <button type="submit" class="btn btn-primary btn-block" style="margin-top: 10px;">
            Verify Code &nbsp;&rarr;
          </button>
        </form>
        <button type="button" id="resendOtpBtn" class="btn btn-block" style="margin-top: 12px;" disabled>
          <i class="fa-solid fa-rotate-right" aria-hidden="true"></i> Resend OTP
        </button>
        <p id="resendCountdown" class="field-hint" aria-live="polite" style="text-align:center;margin-top:8px;"></p>
      </section>

      <div class="auth-divider">or</div>

      <div class="auth-bottom-switch">
        Remembered your password? <a href="login.html">Sign In</a>
      </div>
    </div>
  </div>
</div>

<script src="../js/api.js"></script>
<script>
const emailInput = document.getElementById('email');
const requestStage = document.getElementById('requestStage');
const verificationStage = document.getElementById('verificationStage');
const requestMsg = document.getElementById('msg');
const verifyMsg = document.getElementById('verifyMsg');
const resendButton = document.getElementById('resendOtpBtn');
const countdown = document.getElementById('resendCountdown');
let resetEmailAddress = '';
let cooldownInterval;

function startResendCooldown(seconds) {
  clearInterval(cooldownInterval);
  let remaining = seconds;
  resendButton.disabled = remaining > 0;
  countdown.textContent = `Resend available in ${remaining} seconds.`;
  cooldownInterval = setInterval(() => {
    remaining -= 1;
    if (remaining <= 0) {
      clearInterval(cooldownInterval);
      resendButton.disabled = false;
      countdown.textContent = 'You can request a new code.';
      return;
    }
    countdown.textContent = `Resend available in ${remaining} seconds.`;
  }, 1000);
}

document.getElementById('forgotForm').addEventListener('submit', async (event) => {
  event.preventDefault();
  requestMsg.className = 'form-msg';
  const button = document.getElementById('sendOtpBtn');
  button.disabled = true;
  resetEmailAddress = emailInput.value.trim();

  try {
    const data = await api.post('/auth/forgot-password', { email: resetEmailAddress }, { auth: false });
    sessionStorage.removeItem('passwordResetToken');
    showMsg(verifyMsg, data.message, 'success');
    requestStage.style.display = 'none';
    verificationStage.style.display = 'block';
    startResendCooldown(data.resendAfter || 60);
    document.getElementById('otp').focus();
  } catch (err) {
    showMsg(requestMsg, err.message);
  } finally {
    button.disabled = false;
  }
});

document.getElementById('verifyForm').addEventListener('submit', async (event) => {
  event.preventDefault();
  verifyMsg.className = 'form-msg';
  try {
    const data = await api.post('/auth/verify-reset-otp', {
      email: resetEmailAddress,
      otp: document.getElementById('otp').value.trim(),
    }, { auth: false });
    sessionStorage.setItem('passwordResetToken', data.resetToken);
    window.location.href = 'reset-password.html';
  } catch (err) {
    showMsg(verifyMsg, err.message);
  }
});

resendButton.addEventListener('click', async () => {
  resendButton.disabled = true;
  startResendCooldown(60);
  verifyMsg.className = 'form-msg';
  try {
    const data = await api.post('/auth/resend-reset-otp', { email: resetEmailAddress }, { auth: false });
    showMsg(verifyMsg, data.message, 'success');
    document.getElementById('otp').value = '';
  } catch (err) {
    showMsg(verifyMsg, err.message);
  }
});
</script>
</body>
</html>
