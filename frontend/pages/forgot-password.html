<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Reset password — Play & Grow</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css" />
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <a href="../index.html" class="brand"><span class="dot"></span> Play & Grow</a>
    <h1>Reset your password</h1>
    <p class="sub">Enter your account email and we'll generate a reset link.</p>

    <div id="msg" class="form-msg"></div>

    <form id="forgotForm">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" required autocomplete="email" />
      </div>
      <button type="submit" class="btn btn-primary btn-block">Send reset link</button>
    </form>

    <div id="devTokenBox" style="display:none; margin-top:16px;">
      <div class="field-hint">No email service is wired up in this demo build, so here's your reset link directly:</div>
      <p style="word-break:break-all;"><a id="devLink" href="#"></a></p>
    </div>

    <p class="auth-foot"><a href="login.html">Back to log in</a></p>
  </div>
</div>

<script src="../js/api.js"></script>
<script>
document.getElementById('forgotForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const msg = document.getElementById('msg');
  msg.className = 'form-msg';
  const email = document.getElementById('email').value.trim();

  try {
    const data = await api.post('/auth/forgot-password', { email }, { auth: false });
    showMsg(msg, data.message, 'success');
    if (data.devResetToken) {
      const box = document.getElementById('devTokenBox');
      const link = document.getElementById('devLink');
      link.href = `reset-password.html?token=${data.devResetToken}`;
      link.textContent = link.href;
      box.style.display = 'block';
    }
  } catch (err) {
    showMsg(msg, err.message);
  }
});
</script>
</body>
</html>
