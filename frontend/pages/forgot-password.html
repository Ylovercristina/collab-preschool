<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Reset password — Play-is-School</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
<link rel="stylesheet" href="../css/style.css" />
</head>
<body>
<div class="auth-page-wrap">
  <div class="auth-container">
    <!-- Left Column: Brand Showcase -->
    <div class="auth-brand-side">
      <div class="auth-brand-badge">
        <img src="../img/logocollab.jpg" alt="Play-is-School Logo Thumbnail" />
        <div class="text-group">
          <span class="school-title">Play-is-School</span>
          <span class="school-sub">Learning Platform</span>
        </div>
      </div>

      <div class="auth-logo-center">
        <div class="auth-logo-card">
          <img src="../img/logocollab.jpg" alt="Play-is-School Logo" />
        </div>
      </div>

      <div class="auth-brand-foot">
        <h3>Learning through Play</h3>
        <p>Early Childhood Learning &amp; Safety Hub</p>
      </div>
    </div>

    <!-- Right Column: Reset Form -->
    <div class="auth-form-side">
      <h2>Reset Password</h2>
      <p class="sub-text">Enter your account email and we'll generate a reset link.</p>

      <div id="msg" class="form-msg"></div>

      <form id="forgotForm">
        <div class="auth-field">
          <label class="auth-label" for="email">EMAIL ADDRESS</label>
          <input type="email" id="email" placeholder="name@example.com" required autocomplete="email" />
        </div>
        <button type="submit" class="btn btn-primary btn-block" style="margin-top: 10px;">
          Send Reset Link &nbsp;&rarr;
        </button>
      </form>

      <div id="devTokenBox" style="display:none; margin-top:20px; padding:12px; background:#F8FAFC; border:1px solid #CBD5E1; border-radius:8px;">
        <div class="field-hint" style="margin-bottom:6px;">Demo reset link:</div>
        <p style="word-break:break-all; margin:0;"><a id="devLink" href="#" style="font-weight:600;"></a></p>
      </div>

      <div class="auth-divider">or</div>

      <div class="auth-bottom-switch">
        Remembered your password? <a href="login.html">Sign In</a>
      </div>
    </div>
  </div>
</div>

<script src="../js/api.js"></script>
<script>
document.getElementById('forgotForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const msg = document.getElementById('msg');
  msg.className = 'form-msg';
  const email = document.getElementById('email').value.trim();

  try {
    const data = await api.post('/auth/forgot-password', { email }, { auth: false });
    showMsg(msg, data.message, 'success');
    if (data.devResetToken) {
      const box = document.getElementById('devTokenBox');
      const link = document.getElementById('devLink');
      link.href = `reset-password.html?token=${data.devResetToken}`;
      link.textContent = link.href;
      box.style.display = 'block';
    }
  } catch (err) {
    showMsg(msg, err.message);
  }
});
</script>
</body>
</html>
