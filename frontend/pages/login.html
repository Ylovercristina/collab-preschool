<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log in — Play-is-School</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link rel="stylesheet" href="../css/style.css" />
  <script src="https://www.google.com/recaptcha/api.js?render=explicit" async defer></script>
  <script>
    // Keep OAuth cookies on the same host as the configured callback URL.
    if (window.location.hostname === '127.0.0.1') {
      const localhostUrl = new URL(window.location.href);
      localhostUrl.hostname = 'localhost';
      window.location.replace(localhostUrl.toString());
    }
  </script>
</head>

<body>
  <div class="auth-page-wrap">
    <div class="auth-container">
      <!-- Left Column: Brand Showcase (matching screenshot) -->
      <div class="auth-brand-side">
        <div class="auth-brand-badge">
          <img src="../img/logocollab.jpg" alt="Play-is-School Logo Thumbnail" />
          <div class="text-group">
            <span class="school-title">Play-is-School</span>
            <span class="school-sub">Learning Platform</span>
          </div>
        </div>

        <div class="auth-logo-center">
          <div class="auth-logo-card">
            <img src="../img/logocollab.jpg" alt="Play-is-School Logo" />
          </div>
        </div>

        <div class="auth-brand-foot">
          <h3>Learning through Play</h3>
          <p>Early Childhood Learning &amp; Safety Hub</p>
        </div>
      </div>

      <!-- Right Column: Login Form -->
      <div class="auth-form-side">
        <h2>Welcome Back</h2>
        <p class="sub-text">Please enter your credentials to sign in.</p>

        <div id="msg" class="form-msg"></div>

        <form id="loginForm">
          <div class="auth-field">
            <div class="auth-label-row">
              <label class="auth-label" for="email">EMAIL ADDRESS</label>
            </div>
            <input type="email" id="email" placeholder="example@gmail.com" required autocomplete="email" />
          </div>

          <div class="auth-field">
            <div class="auth-label-row">
              <label class="auth-label" for="password">PASSWORD</label>
              <a href="forgot-password.html" class="auth-forgot-link">Forgot Password?</a>
            </div>
            <div class="input-with-icon">
              <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password" />
              <button type="button" class="toggle-password-btn" id="togglePasswordBtn"
                aria-label="Toggle password visibility">
                <i class="fa-regular fa-eye" id="passwordEyeIcon"></i>
              </button>
            </div>
          </div>

          <button type="submit" class="btn btn-primary btn-block" style="margin-top: 10px;">
            Sign In &nbsp;&rarr;
          </button>
        </form>

        <div class="auth-divider" hidden>or</div>

        <div class="captcha-wrap">
          <div id="recaptchaWidget"></div>
          <div id="captchaStatus" class="captcha-status" role="status"></div>
        </div>

        <a id="googleLoginLink" href="#" class="btn btn-block btn-google" aria-disabled="true">
          <span class="btn-google-badge" aria-hidden="true"><svg viewBox="0 0 48 48" width="18" height="18"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg></span>
          <span class="btn-google-label">Continue with Google</span>
        </a>

        <div class="auth-bottom-switch">
          New parent to the school? <a href="signup.html">Create Account</a>
        </div>
      </div>
    </div>
  </div>

  <script src="../js/api.js"></script>
  <script>
    // Eye toggle password visibility
    const toggleBtn = document.getElementById('togglePasswordBtn');
    const passwordInput = document.getElementById('password');
    const eyeIcon = document.getElementById('passwordEyeIcon');

    toggleBtn.addEventListener('click', () => {
      const isPassword = passwordInput.getAttribute('type') === 'password';
      passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
      eyeIcon.className = isPassword ? 'fa-regular fa-eye-slash' : 'fa-regular fa-eye';
    });

    // Login form handler
    const googleLoginLink = document.getElementById('googleLoginLink');
    const authDivider = document.querySelector('.auth-divider');
    const captchaStatus = document.getElementById('captchaStatus');
    let captchaToken = '';
    let captchaWidgetId = null;
    let captchaReady = false;
    let captchaRenderStarted = false;
    let captchaEnabled = true;
    let googleAuthEnabled = false;

    function setCaptchaMessage(text, type = 'error') {
      captchaStatus.textContent = text;
      captchaStatus.className = text ? `captcha-status ${type}` : 'captcha-status';
    }

    function resetCaptcha(message) {
      captchaToken = '';
      captchaReady = false;
      googleLoginLink.classList.remove('is-enabled', 'is-loading');
      googleLoginLink.setAttribute('aria-disabled', 'true');
      if (captchaWidgetId !== null && window.grecaptcha) window.grecaptcha.reset(captchaWidgetId);
      setCaptchaMessage(message || '');
    }

    function setGoogleButtonEnabled(enabled) {
      googleLoginLink.classList.toggle('is-enabled', enabled);
      googleLoginLink.setAttribute('aria-disabled', enabled ? 'false' : 'true');
    }

    async function loadCaptcha() {
      try {
        const config = await api.get('/auth/recaptcha-config');
        const render = () => {
          if (!window.grecaptcha || captchaWidgetId !== null || captchaRenderStarted) return;
          if (typeof window.grecaptcha.render !== 'function') {
            window.setTimeout(render, 100);
            return;
          }
          captchaRenderStarted = true;
          captchaWidgetId = window.grecaptcha.render('recaptchaWidget', {
            sitekey: config.siteKey,
            callback: (token) => {
              captchaToken = token;
              captchaReady = true;
              googleLoginLink.classList.add('is-enabled');
              googleLoginLink.setAttribute('aria-disabled', 'false');
              setCaptchaMessage('CAPTCHA verified.', 'success');
            },
            'expired-callback': () => resetCaptcha('CAPTCHA expired. Please verify again.'),
            'error-callback': () => {
              captchaToken = '';
              captchaReady = false;
              googleLoginLink.classList.remove('is-enabled', 'is-loading');
              googleLoginLink.setAttribute('aria-disabled', 'true');
              setCaptchaMessage('CAPTCHA could not load. Please refresh and try again.');
            },
          });
        };
        if (window.grecaptcha && typeof window.grecaptcha.ready === 'function') {
          window.grecaptcha.ready(render);
        } else if (window.grecaptcha) render();
        else window.__renderRecaptcha = render;
      } catch (err) {
        setCaptchaMessage(err.message || 'CAPTCHA is unavailable. Please contact the school admin.');
      }
    }

    async function loadAuthSettings() {
      const captchaWrap = document.querySelector('.captcha-wrap');
      try {
        const response = await api.get('/auth/settings');
        const settings = response.settings || {};
        googleAuthEnabled = settings.googleAuthEnabled === true;
        captchaEnabled = settings.captchaEnabled === true;
        // The "or" separates password login from Google sign-in, so it follows Google only.
        authDivider.hidden = !googleAuthEnabled;

        if (!googleAuthEnabled) {
          googleLoginLink.style.display = 'none';
          captchaWrap.hidden = true;
          setCaptchaMessage('Google sign-in is currently disabled by the school administrator.');
          return;
        }

        googleLoginLink.style.display = '';
        captchaWrap.hidden = !captchaEnabled;
        if (captchaEnabled) {
          if (settings.captchaConfigured !== true) {
            setCaptchaMessage('CAPTCHA is enabled but not configured. Please contact the school admin.');
            return;
          }
          loadCaptcha();
        } else {
          captchaReady = true;
          setGoogleButtonEnabled(true);
        }
      } catch (err) {
        authDivider.hidden = true;
        googleLoginLink.style.display = 'none';
        captchaWrap.hidden = true;
        setCaptchaMessage('Google sign-in is temporarily unavailable. Please try again later.');
      }
    }

    const previousCaptchaOnload = window.onload;
    window.onload = () => {
      if (previousCaptchaOnload) previousCaptchaOnload();
      if (window.__renderRecaptcha) window.__renderRecaptcha();
    };
    loadAuthSettings();

    googleLoginLink.addEventListener('click', async (event) => {
      event.preventDefault();
      if (!googleAuthEnabled) {
        setCaptchaMessage('Google sign-in is currently disabled by the school administrator.');
        return;
      }
      if (captchaEnabled && (!captchaReady || !captchaToken)) {
        setCaptchaMessage('Please complete the CAPTCHA verification first.');
        return;
      }
      googleLoginLink.classList.add('is-loading');
      googleLoginLink.setAttribute('aria-disabled', 'true');
      setCaptchaMessage('Starting Google sign-in...', 'success');
      try {
        const data = await api.post('/auth/google/start', {
          mode: 'login',
          token: captchaToken,
          loginHint: document.getElementById('email').value.trim(),
        }, { auth: false });
        window.location.assign(data.authorizationUrl);
      } catch (err) {
        if (captchaEnabled) {
          resetCaptcha(err.message || 'CAPTCHA verification failed or expired. Please try again.');
          return;
        }
        // reCAPTCHA is off: its status box is hidden, so report the error in the main
        // message area and keep the Google button usable for another try.
        googleLoginLink.classList.remove('is-loading');
        setGoogleButtonEnabled(true);
        setCaptchaMessage('');
        showMsg(document.getElementById('msg'), err.message || 'Google sign-in could not be started. Please try again.');
      }
    });

    // Returning with the browser Back button can restore the page mid-redirect; unlock the button.
    window.addEventListener('pageshow', (event) => {
      if (!event.persisted) return;
      googleLoginLink.classList.remove('is-loading');
      if (googleAuthEnabled && (!captchaEnabled || captchaToken)) setGoogleButtonEnabled(true);
    });

    if (new URLSearchParams(window.location.search).get('passwordReset') === 'success') {
      showMsg(document.getElementById('msg'), 'Your password has been reset. Please sign in.', 'success');
    }

    const loginMsg = document.getElementById('msg');
    const loginParams = new URLSearchParams(window.location.search);
    const googleErrors = {
      cancelled: 'Google sign-in was cancelled.',
      unverified: 'Google could not verify this email. Please use a verified account.',
      'no-account': 'No account found for this Google email. Please sign up first.',
      approval: 'Your parent account is awaiting admin approval.',
      archived: 'This account has been archived. Contact the school admin.',
      'linked-account': 'This account is linked to a different Google account.',
      configuration: 'Google sign-in is not configured. Please contact the school admin.',
      'invalid-state': 'Google sign-in could not be verified. Please try again.',
      'invalid-mode': 'Google sign-in could not be started. Please try again.',
      'captcha-required': 'Please complete the CAPTCHA verification first.',
      'google-disabled': 'Google sign-in is currently disabled by the school administrator.',
      failed: 'Google sign-in could not be completed. Please try again.',
    };
    const googleError = loginParams.get('googleError');
    if (googleErrors[googleError]) showMsg(loginMsg, googleErrors[googleError]);

    const googleNotice = loginParams.get('googleNotice');
    if (googleNotice === 'approval') showMsg(loginMsg, 'Your parent account is awaiting admin approval.', 'success');

    const googleCode = loginParams.get('googleCode');
    if (googleCode) {
      window.history.replaceState({}, document.title, window.location.pathname);
      showMsg(loginMsg, 'Signing in with Google...', 'success');
      api.post('/auth/google/exchange', { code: googleCode }, { auth: false })
        .then((data) => {
          const dashboard = `dashboard-${data.user.role}.html`;
          Auth.setSession(data.token, data.user);
          if (googleNotice === 'account-exists') {
            showMsg(loginMsg, 'Google sign-in complete. This account already exists; you are signed in.', 'success');
            setTimeout(() => window.location.replace(dashboard), 900);
            return;
          }
          window.location.replace(dashboard);
        })
        .catch((err) => {
          showMsg(loginMsg, err.message || 'Could not complete Google sign-in.');
        });
    }

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const msg = document.getElementById('msg');
      msg.className = 'form-msg';
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      try {
        const data = await api.post('/auth/login', { email, password }, { auth: false });
        Auth.setSession(data.token, data.user);
        window.location.href = `dashboard-${data.user.role}.html`;
      } catch (err) {
        showMsg(msg, err.message);
      }
    });
  </script>
</body>

</html>
