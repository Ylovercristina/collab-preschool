<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Log in — Play-is-School</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
<link rel="stylesheet" href="../css/style.css" />
</head>
<body>
<div class="auth-page-wrap">
  <div class="auth-container">
    <!-- Left Column: Brand Showcase (matching screenshot) -->
    <div class="auth-brand-side">
      <div class="auth-brand-badge">
        <img src="../img/logocollab.jpg" alt="Play-is-School Logo Thumbnail" />
        <div class="text-group">
          <span class="school-title">Play-is-School</span>
          <span class="school-sub">Learning Platform</span>
        </div>
      </div>

      <div class="auth-logo-center">
        <div class="auth-logo-card">
          <img src="../img/logocollab.jpg" alt="Play-is-School Logo" />
        </div>
      </div>

      <div class="auth-brand-foot">
        <h3>Learning through Play</h3>
        <p>Early Childhood Learning &amp; Safety Hub</p>
      </div>
    </div>

    <!-- Right Column: Login Form -->
    <div class="auth-form-side">
      <h2>Welcome Back</h2>
      <p class="sub-text">Please enter your credentials to sign in.</p>

      <div id="msg" class="form-msg"></div>

      <form id="loginForm">
        <div class="auth-field">
          <div class="auth-label-row">
            <label class="auth-label" for="email">EMAIL ADDRESS</label>
          </div>
          <input type="email" id="email" placeholder="admin@gmail.com" required autocomplete="email" />
        </div>

        <div class="auth-field">
          <div class="auth-label-row">
            <label class="auth-label" for="password">PASSWORD</label>
            <a href="forgot-password.html" class="auth-forgot-link">Forgot Password?</a>
          </div>
          <div class="input-with-icon">
            <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password" />
            <button type="button" class="toggle-password-btn" id="togglePasswordBtn" aria-label="Toggle password visibility">
              <i class="fa-regular fa-eye" id="passwordEyeIcon"></i>
            </button>
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-block" style="margin-top: 10px;">
          Sign In &nbsp;&rarr;
        </button>
      </form>

      <div class="auth-divider">or</div>

      <a id="googleLoginLink" href="#" class="btn btn-block btn-google">
        <i class="fa-brands fa-google" aria-hidden="true"></i> Continue with Google
      </a>

      <div class="auth-bottom-switch">
        New parent to the school? <a href="signup.html">Create Account</a>
      </div>
    </div>
  </div>
</div>

<script src="../js/api.js"></script>
<script>
// Eye toggle password visibility
const toggleBtn = document.getElementById('togglePasswordBtn');
const passwordInput = document.getElementById('password');
const eyeIcon = document.getElementById('passwordEyeIcon');

toggleBtn.addEventListener('click', () => {
  const isPassword = passwordInput.getAttribute('type') === 'password';
  passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
  eyeIcon.className = isPassword ? 'fa-regular fa-eye-slash' : 'fa-regular fa-eye';
});

// Login form handler
const googleLoginLink = document.getElementById('googleLoginLink');
googleLoginLink.href = `${API_BASE}/auth/google?mode=login`;

if (new URLSearchParams(window.location.search).get('passwordReset') === 'success') {
  showMsg(document.getElementById('msg'), 'Your password has been reset. Please sign in.', 'success');
}

const loginMsg = document.getElementById('msg');
const loginParams = new URLSearchParams(window.location.search);
const googleErrors = {
  cancelled: 'Google sign-in was cancelled.',
  unverified: 'Google could not verify this email. Please use a verified account.',
  'no-account': 'No account found for this Google email. Please sign up first.',
  approval: 'Your parent account is awaiting admin approval.',
  archived: 'This account has been archived. Contact the school admin.',
  'linked-account': 'This account is linked to a different Google account.',
  configuration: 'Google sign-in is not configured. Please contact the school admin.',
  'invalid-state': 'Google sign-in could not be verified. Please try again.',
  'invalid-mode': 'Google sign-in could not be started. Please try again.',
  failed: 'Google sign-in could not be completed. Please try again.',
};
const googleError = loginParams.get('googleError');
if (googleErrors[googleError]) showMsg(loginMsg, googleErrors[googleError]);

const googleNotice = loginParams.get('googleNotice');
if (googleNotice === 'approval') showMsg(loginMsg, 'Your parent account is awaiting admin approval.', 'success');

const googleCode = loginParams.get('googleCode');
if (googleCode) {
  window.history.replaceState({}, document.title, window.location.pathname);
  showMsg(loginMsg, 'Completing Google sign-in...', 'success');
  api.post('/auth/google/exchange', { code: googleCode }, { auth: false }).then((data) => {
    Auth.setSession(data.token, data.user);
    const dashboard = `dashboard-${data.user.role}.html`;
    if (googleNotice === 'account-exists') {
      showMsg(loginMsg, 'Account already exists, logged you in.', 'success');
      setTimeout(() => window.location.replace(dashboard), 900);
      return;
    }
    window.location.replace(dashboard);
  }).catch((err) => showMsg(loginMsg, err.message));
}

document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const msg = document.getElementById('msg');
  msg.className = 'form-msg';
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;

  try {
    const data = await api.post('/auth/login', { email, password }, { auth: false });
    Auth.setSession(data.token, data.user);
    window.location.href = `dashboard-${data.user.role}.html`;
  } catch (err) {
    showMsg(msg, err.message);
  }
});
</script>
</body>
</html>
