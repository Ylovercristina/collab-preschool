<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Log in — Play & Grow</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css" />
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <a href="../index.html" class="brand"><span class="dot"></span> Play & Grow</a>
    <h1>Welcome back</h1>
    <p class="sub">Log in to see today's updates.</p>

    <div id="msg" class="form-msg"></div>

    <form id="loginForm">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" required autocomplete="email" />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" required autocomplete="current-password" />
      </div>
      <button type="submit" class="btn btn-primary btn-block">Log in</button>
    </form>

    <p class="auth-foot">
      <a href="forgot-password.html">Forgot your password?</a><br /><br />
      New here? <a href="signup.html">Create an account</a>
    </p>
  </div>
</div>

<script src="../js/api.js"></script>
<script>
document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const msg = document.getElementById('msg');
  msg.className = 'form-msg';
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;

  try {
    const data = await api.post('/auth/login', { email, password }, { auth: false });
    Auth.setSession(data.token, data.user);
    window.location.href = `dashboard-${data.user.role}.html`;
  } catch (err) {
    showMsg(msg, err.message);
  }
});
</script>
</body>
</html>
