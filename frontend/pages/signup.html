<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign up — Play-is-School</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
<link rel="stylesheet" href="../css/style.css" />
</head>
<body>
<div class="auth-page-wrap">
  <div class="auth-container">
    <!-- Left Column: Matching Brand Showcase -->
    <div class="auth-brand-side">
      <div class="auth-brand-badge">
        <img src="../img/logocollab.jpg" alt="Play-is-School Logo Thumbnail" />
        <div class="text-group">
          <span class="school-title">Play-is-School</span>
          <span class="school-sub">Learning Platform</span>
        </div>
      </div>

      <div class="auth-logo-center">
        <div class="auth-logo-card">
          <img src="../img/logocollab.jpg" alt="Play-is-School Logo" />
        </div>
      </div>

      <div class="auth-brand-foot">
        <h3>Learning through Play</h3>
        <p>Early Childhood Learning &amp; Safety Hub</p>
      </div>
    </div>

    <!-- Right Column: Registration Form -->
    <div class="auth-form-side">
      <h2>Create Account</h2>
      <p class="sub-text">Join the Play-is-School community today.</p>

      <div id="msg" class="form-msg"></div>

      <form id="signupForm">
        <div class="auth-field">
          <label class="auth-label" for="name">FULL NAME</label>
          <input type="text" id="name" placeholder="Jane Doe" required />
        </div>

        <div class="auth-field">
          <label class="auth-label" for="email">EMAIL ADDRESS</label>
          <input type="email" id="email" placeholder="name@example.com" required autocomplete="email" />
        </div>

        <div class="auth-field">
          <label class="auth-label" for="phone">PHONE NUMBER (OPTIONAL)</label>
          <input type="tel" id="phone" placeholder="0912 345 6789" />
        </div>

        <div class="auth-field">
          <label class="auth-label" for="password">PASSWORD</label>
          <div class="input-with-icon">
            <input type="password" id="password" placeholder="At least 6 characters" required minlength="6" autocomplete="new-password" />
            <button type="button" class="toggle-password-btn" id="togglePasswordBtn" aria-label="Toggle password visibility">
              <i class="fa-regular fa-eye" id="passwordEyeIcon"></i>
            </button>
          </div>
        </div>

        <button type="submit" class="btn btn-primary btn-block" style="margin-top: 10px;">
          Create Account &nbsp;&rarr;
        </button>
      </form>

      <div class="auth-divider">or</div>

      <a id="googleSignupLink" href="#" class="btn btn-block btn-google">
        <span class="btn-google-badge" aria-hidden="true"><svg viewBox="0 0 48 48" width="18" height="18"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg></span>
        <span class="btn-google-label">Continue with Google</span>
      </a>

      <div class="auth-bottom-switch">
        Already have an account? <a href="login.html">Sign In</a>
      </div>
    </div>
  </div>
</div>

<script src="../js/api.js"></script>
<script>
// Eye toggle password visibility
const toggleBtn = document.getElementById('togglePasswordBtn');
const passwordInput = document.getElementById('password');
const eyeIcon = document.getElementById('passwordEyeIcon');

toggleBtn.addEventListener('click', () => {
  const isPassword = passwordInput.getAttribute('type') === 'password';
  passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
  eyeIcon.className = isPassword ? 'fa-regular fa-eye-slash' : 'fa-regular fa-eye';
});

// Signup form handler
document.getElementById('googleSignupLink').href = `${API_BASE}/auth/google?mode=signup`;

document.getElementById('signupForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const msg = document.getElementById('msg');
  msg.className = 'form-msg';

  const payload = {
    role: 'parent',
    name: document.getElementById('name').value.trim(),
    email: document.getElementById('email').value.trim(),
    phone: document.getElementById('phone').value.trim(),
    password: document.getElementById('password').value,
  };

  try {
    const data = await api.post('/auth/signup', payload, { auth: false });
    if (data.token) {
      Auth.setSession(data.token, data.user);
      window.location.href = `dashboard-${data.user.role}.html`;
    } else {
      showMsg(msg, data.message, 'success');
    }
  } catch (err) {
    msg.textContent = '';
    msg.className = 'form-msg';
    const emailTaken = /already exists/i.test(err.message || '');
    if (emailTaken) {
      const emailInput = document.getElementById('email');
      showErrorPopup(`An account with ${payload.email} already exists. Sign in instead, or use a different email address.`, {
        title: 'Email already registered',
        action: { label: 'Go to Sign In', href: 'login.html' },
        onClose: () => { emailInput.focus(); emailInput.select(); },
      });
    } else {
      showErrorPopup(err.message || 'Could not create your account. Please try again.', { title: 'Could not create account' });
    }
  }
});
</script>
</body>
</html>
